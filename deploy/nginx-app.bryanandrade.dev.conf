# BryanAI — app.bryanandrade.dev
# Sobe primeiro em HTTP: o certbot precisa responder ao desafio ACME antes de
# existir certificado. Depois do `certbot --nginx`, este arquivo ganha o bloco
# 443 e o redirect automaticamente.

server {
    server_name app.bryanandrade.dev;

    # Desafio HTTP-01 do Let's Encrypt.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ---- Cabeçalhos de segurança ----
    # HSTS: depois da primeira visita o navegador recusa HTTP para este host,
    # fechando a janela em que um redirect 301 pode ser interceptado. Sem
    # includeSubDomains — o certificado cobre só este subdomínio, e a raiz do
    # domínio pode vir a apontar para outro lugar.
    add_header Strict-Transport-Security "max-age=31536000" always;
    # SAMEORIGIN e não DENY: a tela de comparação de currículos usa iframes
    # apontando para /api/preview/<template> na própria origem.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Upload de currículo/carta em PDF ou DOCX. O padrão do nginx (1MB) recusaria
    # um PDF com imagens antes de a aplicação ver a requisição.
    client_max_body_size 12M;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        'upgrade';
        # Sem estes dois o rate limit do login veria todas as tentativas vindas
        # de 127.0.0.1 e trancaria a conta a partir de qualquer atacante.
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Geração de PDF e chamadas à IA passam de 60s no pior caso (retry com
        # backoff). O padrão do nginx cortaria a resposta antes do fim.
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/app.bryanandrade.dev/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/app.bryanandrade.dev/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = app.bryanandrade.dev) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name app.bryanandrade.dev;
    return 404; # managed by Certbot


}